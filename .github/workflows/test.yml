name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python-version }} · ${{ matrix.install-variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        install-variant: ["vanilla", "with-extras"]
        # Wave P (rubric §3.2): cross-OS macOS+Linux matrix; vanilla path runs
        # without scipy/meshio so confirms NumPy-only red line cross-platform.

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.install-variant }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.install-variant }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package (vanilla — NumPy mandatory only)
        if: matrix.install-variant == 'vanilla'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install package (with-extras — sparse + mesh)
        if: matrix.install-variant == 'with-extras'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sparse,mesh]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy structure_optimizer/

      - name: Run tests with coverage
        run: pytest --cov=structure_optimizer --cov-report=term --cov-report=xml -q

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # Fingerprint reproducibility is gated cross-platform at the TOLERANT tier:
      # input_hash (platform-independent) must be exact and densities must match
      # to 1e-9 — this runs on every matrix cell and is the CI regression gate.
      # Byte-exact reproducibility (REQUIRE_BIT_EXACT_FINGERPRINT=1) is a
      # WITHIN-PLATFORM property only: iterative CG output is not bit-identical
      # across BLAS backends (macOS Accelerate vs Linux OpenBLAS) and the stored
      # fingerprints are generated on the dev host, so the strict SHA tier is
      # verified locally on the generating host, NOT in cross-platform CI.
      # (The newer benchmarks pin input_hash, not solve-SHA, for the same reason.)
      - name: Fingerprint reproducibility (tolerant, cross-platform)
        run: pytest tests/test_fingerprints.py -q

      # NOTE (2026-06): the v4–v16 "test agent" rubric scorecards were removed
      # from CI. Each `scripts/test_agent.py --rubric vN` re-runs the FULL test
      # suite as its D033 no-regression gate, so 13 stacked steps = ~13× the
      # suite (~18h) — well past GitHub's 6h job limit. The rubric is a
      # development self-grading tool, not a correctness oracle: the real CI
      # gate is the matrix above (ruff/format/mypy/pytest+coverage on every
      # OS×Py×variant cell) plus fingerprint reproducibility, the smoke job,
      # and the web build. Run the rubric on demand locally:
      #   python scripts/test_agent.py --rubric v16 --strict

  smoke:
    name: End-to-end smoke (Python 3.12 with extras)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sparse,mesh]"

      - name: Verify console script works
        run: structure-optimizer --help

      - name: Run benchmark smoke (run + verify + report + demo + study + export)
        run: |
          structure-optimizer run --benchmark mbb_beam --preset smoke
          RUN_DIR=$(ls -td runs/mbb_beam/*/ | head -1)
          structure-optimizer verify --run "$RUN_DIR" | grep -q "^passed$"
          structure-optimizer report --run "$RUN_DIR"
          structure-optimizer demo --benchmark simple_bracket --preset smoke
          structure-optimizer study --config studies/simple_bracket_tradeoff.json
          structure-optimizer run --benchmark mbb_beam --preset smoke --algorithm beso
          structure-optimizer export --run "$RUN_DIR" --format svg
          structure-optimizer export --run "$RUN_DIR" --format dxf
          structure-optimizer export --run "$RUN_DIR" --format stl

  web:
    name: Web build (tsc --noEmit + vite)
    runs-on: ubuntu-latest
    # The React/TS workbench was previously ungated in CI (Python-only matrix).
    # `npm run build` = `tsc --noEmit && vite build`, so this gates both strict
    # type-checking and a production build of web/.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type-check + production build
        run: npm run build
        working-directory: web
