name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python-version }} · ${{ matrix.install-variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        install-variant: ["vanilla", "with-extras"]
        # Wave P (rubric §3.2): cross-OS macOS+Linux matrix; vanilla path runs
        # without scipy/meshio so confirms NumPy-only red line cross-platform.

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.install-variant }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.install-variant }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package (vanilla — NumPy mandatory only)
        if: matrix.install-variant == 'vanilla'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install package (with-extras — sparse + mesh)
        if: matrix.install-variant == 'with-extras'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sparse,mesh]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy structure_optimizer/

      - name: Run tests with coverage
        run: pytest --cov=structure_optimizer --cov-report=term --cov-report=xml -q

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Cross-platform bit-exact fingerprint check (Linux + Python 3.12 with-extras only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        env:
          REQUIRE_BIT_EXACT_FINGERPRINT: "1"
        run: pytest tests/test_fingerprints.py -q

      - name: Cross-platform tolerant fingerprint check (other matrix cells)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12' || matrix.install-variant != 'with-extras'
        run: pytest tests/test_fingerprints.py -q

      - name: v4 test agent — rubric scorecard (no-regression gate)
        # Wave X §4.6: dedicated test agent must run in CI on the canonical
        # matrix cell. Non-zero exit indicates a v4 rubric regression.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v4 --strict

      - name: v5 test agent — multi-physics rubric scorecard
        # v5 §4.7: v5 rubric scored after v4 regression check passes. Strict
        # gate is enabled once v5 reaches release-ready (≥99/100); during
        # active development the score is informational.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v5

      - name: v6 test agent — production-grade rubric scorecard
        # v6 §4.7: v6 rubric scored after v5. The v6 run also enforces the D033
        # pytest-green no-regression gate (hard-fail) and the v4/v5 regression
        # checks. Informational during development; strict once v6 reaches ≥99.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v6

      - name: v7 test agent — production-drivers rubric scorecard
        # v7 §4.7: v7 rubric scored after v6. The v7 run enforces the D033
        # pytest-green no-regression gate and the v4/v5/v6 regression checks.
        # Strict once v7 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v7

      - name: v8 test agent — closing-the-loop rubric scorecard
        # v8 §4.7: v8 rubric scored after v7. The v8 run enforces the D033
        # pytest-green no-regression gate and the v4/v5/v6/v7 regression checks.
        # Strict once v8 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v8 --strict

      - name: v9 test agent — second-order-drivers rubric scorecard
        # v9 §4.7: v9 rubric scored after v8. The v9 run enforces the D033
        # pytest-green no-regression gate and the v4/v5/v6/v7/v8 regression checks.
        # Strict once v9 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v9 --strict

      - name: v10 test agent — constraint-rich/manufacturable rubric scorecard
        # v10 §4.7: v10 rubric scored after v9. The v10 run enforces the D033
        # pytest-green no-regression gate and the v4-v9 regression checks.
        # Strict once v10 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v10 --strict

      - name: v11 test agent — exact-&-robust rubric scorecard
        # v11 §4.7: v11 rubric scored after v10. The v11 run enforces the D033
        # pytest-green no-regression gate and the v4-v10 regression checks.
        # Strict once v11 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v11 --strict

      - name: v12 test agent — design-grade-&-adaptive rubric scorecard
        # v12 §4.7: v12 rubric scored after v11. The v12 run enforces the D033
        # pytest-green no-regression gate and the v4-v11 regression checks.
        # Strict once v12 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v12 --strict

      - name: v13 test agent — robust-drivers-&-validated-geometry rubric scorecard
        # v13 §4.7: v13 rubric scored after v12. The v13 run enforces the D033
        # pytest-green no-regression gate and the v4-v12 regression checks.
        # Strict once v13 reaches ≥99/100.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v13 --strict

      - name: v14 test agent — integration-&-production-wiring rubric scorecard
        # v14 §4.7: v14 rubric scored after v13. The v14 run enforces the D033
        # pytest-green no-regression gate and the v4-v13 regression checks.
        # Strict: v14 reached 100/100 at closure (Wave HHHHHH, D105).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v14 --strict

      - name: v15 test agent — embedded-constraints-&-rigorous-closure rubric scorecard
        # v15 §4.7: v15 rubric scored after v14. The v15 run enforces the D033
        # pytest-green no-regression gate and the v4-v14 regression checks.
        # Strict: v15 reached 100/100 at closure (Wave HHHHHHH, D113).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v15 --strict

      - name: v16 test agent — deep-embedding-&-exact-generalization rubric scorecard
        # v16 §4.7: v16 rubric scored after v15. The v16 run enforces the D033
        # pytest-green no-regression gate and the v4-v15 regression checks.
        # Strict: v16 reached 100/100 at closure (Wave HHHHHHHH, D121).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.install-variant == 'with-extras'
        run: python scripts/test_agent.py --rubric v16 --strict

  smoke:
    name: End-to-end smoke (Python 3.12 with extras)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sparse,mesh]"

      - name: Verify console script works
        run: structure-optimizer --help

      - name: Run benchmark smoke (run + verify + report + demo + study + export)
        run: |
          structure-optimizer run --benchmark mbb_beam --preset smoke
          RUN_DIR=$(ls -td runs/mbb_beam/*/ | head -1)
          structure-optimizer verify --run "$RUN_DIR" | grep -q "^passed$"
          structure-optimizer report --run "$RUN_DIR"
          structure-optimizer demo --benchmark simple_bracket --preset smoke
          structure-optimizer study --config studies/simple_bracket_tradeoff.json
          structure-optimizer run --benchmark mbb_beam --preset smoke --algorithm beso
          structure-optimizer export --run "$RUN_DIR" --format svg
          structure-optimizer export --run "$RUN_DIR" --format dxf
          structure-optimizer export --run "$RUN_DIR" --format stl

  web:
    name: Web build (tsc --noEmit + vite)
    runs-on: ubuntu-latest
    # The React/TS workbench was previously ungated in CI (Python-only matrix).
    # `npm run build` = `tsc --noEmit && vite build`, so this gates both strict
    # type-checking and a production build of web/.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type-check + production build
        run: npm run build
        working-directory: web
