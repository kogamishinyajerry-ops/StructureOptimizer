[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-optimizer"
version = "0.5.0"
description = "Local, dependency-light (numpy-only) 2D/2.5D SIMP topology-optimization engine with independent verification, fronted by a React/FastAPI live web workbench."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.scripts]
structure-optimizer = "structure_optimizer.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
sparse = [
  "scipy>=1.11",
]
mesh = [
  "meshio>=5.0",
]
amg = [
  "scipy>=1.11",
  "pyamg>=5.0",
]
bayes = [
  "scipy>=1.11",
  "scikit-learn>=1.3",
]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Upper-bounded: ruff/mypy introduce new lint+type rules in minor/major bumps,
  # so an unbounded floor (was ruff>=0.5 / mypy>=1.10) let CI go red on an
  # unrelated tool upgrade with zero code change. Pin to the current minor so
  # upgrades are deliberate (bump + fix findings), not surprise failures.
  "ruff>=0.15.16,<0.16",
  "mypy>=2.1,<2.2",
  "scipy>=1.11",
  "meshio>=5.0",
]

[tool.setuptools]
packages = ["structure_optimizer", "structure_optimizer.adapters", "structure_optimizer.benchmarks", "structure_optimizer.core", "structure_optimizer.visualization"]

[tool.setuptools.package-data]
structure_optimizer = ["benchmarks/configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["structure_optimizer"]
omit = [
  "structure_optimizer/visualization/*",          # bespoke binary GIF/PNG — exercised by tests producing valid files; line cov misleading
  "structure_optimizer/adapters/optimizer_base.py", # documented future-extension Protocol stub
  "structure_optimizer/adapters/file_export.py",    # documented future-extension Protocol stub
  "structure_optimizer/__main__.py",              # one-line entry point
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 1

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["structure_optimizer", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line too long (we set our own length above; tolerate occasional long strings)
  "RUF001", # Chinese fullwidth punctuation in strings is intentional (project is bilingual)
  "RUF002", # Greek / math symbols in docstrings (ν, ρ, ≈, →) are intentional physics notation
  "RUF003", # comment unicode (same rationale)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False idiom

[tool.mypy]
python_version = "3.11"
files = ["structure_optimizer"]
exclude = ["structure_optimizer/visualization/"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Not strict mode: numpy stubs are coarse and projection helpers use np.ndarray heavily.
# We aim for "obvious mistakes catch" not "academic strictness".
# visualization/ is excluded: bespoke GIF/PNG encoding has unavoidable numpy/tuple
# type-system quirks; correctness is verified by tests producing valid binary files.

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "meshio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "structure_optimizer.visualization.*"
ignore_errors = true

# Optional solver backend (adapters/solver_base.py guards `import pyamg` behind a
# try/except); not a hard dependency, so no stubs are installed.
[[tool.mypy.overrides]]
module = "pyamg.*"
ignore_missing_imports = true

# Exploratory v6–v16 research modules (higher-order QMC, copula reliability,
# NSGA Pareto, orthotropic/thermal/stress analysis, autodiff, Bayesian opt).
# These are UNREACHABLE from the product path (CLI / server / run_config /
# benchmarks — verified zero non-test importers) and are documented as debt in
# docs/ASSESSMENT-2026-05-29.md + the README 范围与状态 section. Excluded from
# type-checking for the same reason as visualization/: bespoke numpy/tuple quirks
# in non-product code, correctness gated by their own tests, not by mypy.
[[tool.mypy.overrides]]
module = [
    "structure_optimizer.core.pareto_nsga",
    "structure_optimizer.core.orthotropic_simp",
    "structure_optimizer.core.bayesian_opt",
    "structure_optimizer.core.reliability",
    "structure_optimizer.core.autodiff",
    "structure_optimizer.core.thermal",
    "structure_optimizer.core.stress",
]
ignore_errors = true

